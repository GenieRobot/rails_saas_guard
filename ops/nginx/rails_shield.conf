# Include this inside a server block after review.
if ($request_method ~* ^(?:PROPFIND|PROPPATCH|MKCOL|COPY|MOVE|LOCK|UNLOCK|SEARCH)$) {
  return 403;
}

location ~* \.php(?:$|/) {
  access_log /var/log/nginx/access.log combined;
  return 403;
}
location ~* ^/(?:\.env|\.git|wp-admin|wp-login|wp-content|xmlrpc\.php)(?:$|/) {
  return 403;
}
