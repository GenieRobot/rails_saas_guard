name: Security monitor

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Audit Ruby dependencies
        run: |
          gem install bundler-audit --no-document
          bundle-audit check --update

  threat-intelligence-review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Fetch bounded authoritative feeds
        run: script/threat_intelligence --since "$(date -u -d '8 days ago' +%F)" > threat-report.md
      - name: Open one review issue when candidates exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -q '^- CVE-' threat-report.md || exit 0
          title="Rails SaaS Guard threat candidates $(date -u +%F)"
          existing=$(gh issue list --state open --search '"Rails SaaS Guard threat candidates" in:title' --json number --jq 'length')
          if [[ "$existing" == "0" ]]; then
            gh issue create --title "$title" --body-file threat-report.md
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: threat-intelligence-report
          path: threat-report.md
          retention-days: 30
