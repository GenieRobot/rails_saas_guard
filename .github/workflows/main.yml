name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    name: Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.2'
          - '3.3'
          - '3.4'

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the default task
        run: bundle exec rake
      - name: Build and inspect gem
        run: |
          gem build rails_shield.gemspec
          gem specification rails_shield-*.gem files
      - name: Check operations scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y acl attr fail2ban
          ./ops/test.sh

  compatibility:
    runs-on: ubuntu-24.04
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Rack 2.2 + Rack::Attack 6.7 / Ruby 3.2
            ruby: '3.2'
            gemfile: rack_2_2
          - name: Rack 3.2 / Ruby 3.4
            ruby: '3.4'
            gemfile: rack_3_2
          - name: Rails 7.1 / Ruby 3.2
            ruby: '3.2'
            gemfile: rails_7_1
          - name: Rails 7.2 / Ruby 3.3
            ruby: '3.3'
            gemfile: rails_7_2
          - name: Rails 8.0 / Ruby 3.3
            ruby: '3.3'
            gemfile: rails_8_0
          - name: Rails 8.1 / Ruby 3.4
            ruby: '3.4'
            gemfile: rails_8_1
    env:
      BUNDLE_GEMFILE: gemfiles/${{ matrix.gemfile }}.gemfile
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec
