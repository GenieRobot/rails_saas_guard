name: Release gem

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    environment: rubygems
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec rake
      - run: gem build rails_saas_guard.gemspec
      - name: Publish after protected-environment approval
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: gem push rails_saas_guard-*.gem
